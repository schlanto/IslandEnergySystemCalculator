name: Create component pull request
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  create:
    # Issue Form labels are only applied when the configured label already
    # exists in the repository. Use the form's title prefix as a fallback so
    # a valid component submission is not skipped when that label is missing.
    if: >-
      contains(github.event.issue.labels.*.name, 'component submission') ||
      startsWith(github.event.issue.title, '[Component]:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Save structured issue body
        uses: actions/github-script@v7
        with:
          script: |
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/issue-body.md`, context.payload.issue.body || '')
      - name: Generate component JSON
        id: component
        run: npm run component:from-issue -- "$RUNNER_TEMP/issue-body.md"
      - run: npm run validate:data
      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: component/${{ steps.component.outputs.component_id }}
          commit-message: 'Add component: ${{ steps.component.outputs.component_name }}'
          title: 'Add ${{ steps.component.outputs.component_name }}'
          labels: component-data,needs-review
          body: |
            Closes #${{ github.event.issue.number }}

            - Role: `${{ steps.component.outputs.component_role }}`
            - Source: ${{ steps.component.outputs.source_url }}
            - Automated schema validation: passed

            Reviewer checklist:
            - [ ] Source supports every submitted value
            - [ ] Values and units are correct
            - [ ] Unknowns remain explicit
            - [ ] Identifier and category are appropriate

            This pull request must be reviewed and will never merge automatically.
      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.pr.outputs.pull-request-url }}'
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `A validated draft pull request was created: ${url}\n\nA maintainer must verify the source and data before merging.`})
      - name: Report parsing failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'The automated component conversion failed. Please check every required field, the source URL, numerical formatting, and units. No pull request was created.'})
