name: Add a component
description: Suggest a device for the public component list.
title: '[Component]: '
labels: ['component submission', 'needs review']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. Copy values from a public datasheet or manual.
        Enter numbers only in the requested unit. Leave unknown values empty instead of guessing.

  - type: dropdown
    id: role
    attributes:
      label: Component role
      options:
        - consumer
        - generator
        - storage
        - converter
    validations:
      required: true

  - type: input
    id: subtype
    attributes:
      label: Component subtype
      description: For example refrigerator, solar panel, battery, or dc_ac_inverter.
    validations:
      required: true

  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Readable name
      placeholder: Example 100 W refrigerator
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Short description

  - type: markdown
    attributes:
      value: |
        ## Source
        At least one public source is required.

  - type: dropdown
    id: source_type
    attributes:
      label: Source type
      options:
        - manufacturer_datasheet
        - manufacturer_product_page
        - official_manual
        - certification_document
        - scientific_publication
        - measurement
    validations:
      required: true

  - type: input
    id: source_title
    attributes:
      label: Source title
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: Source URL
      placeholder: https://example.com/datasheet.pdf
    validations:
      required: true

  - type: input
    id: accessed
    attributes:
      label: Date accessed
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Basic electrical values
        Fill in only the values that apply to this device.
        Enter numbers only, for example `48` or `12.5`. Do not type the unit into the field.

  - type: input
    id: voltage
    attributes:
      label: Nominal or output voltage (V)
      description: 'Enter volts. Example: 48 or 230.'

  - type: input
    id: min_voltage
    attributes:
      label: Minimum input voltage (V)
      description: Mainly for inverters and converters.

  - type: input
    id: max_voltage
    attributes:
      label: Maximum input voltage (V)
      description: Mainly for inverters and converters.

  - type: input
    id: power
    attributes:
      label: Rated or continuous power (W)
      description: 'Enter watts. Example: 500.'

  - type: input
    id: peak_power
    attributes:
      label: Startup or peak power (W)
      description: Enter watts. Leave empty if the source does not provide it.

  - type: input
    id: peak_duration
    attributes:
      label: Peak duration (seconds)

  - type: input
    id: capacity
    attributes:
      label: Usable battery capacity (Wh)
      description: Storage only. Enter watt-hours, not amp-hours.

  - type: input
    id: battery_power
    attributes:
      label: Maximum continuous battery output (W)
      description: Storage only.

  - type: input
    id: efficiency
    attributes:
      label: Efficiency (%)
      description: 'Example: enter 93 for 93%.'

  - type: textarea
    id: notes
    attributes:
      label: Additional notes

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I provided a public source.
          required: true
        - label: I checked every value and unit.
          required: true
        - label: I left unknown values empty instead of guessing.
          required: true
        - label: I understand that this public contribution will be reviewed and may be edited.
          required: true
